name: Build & publish pandoc-latex-fonts image

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - Dockerfile.pandoc-fonts
      - .github/workflows/build-pandoc-fonts-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # NOTE: org-level image name (not tied to this repo name)
          images: ghcr.io/<ORG>/pandoc-latex-fonts
          tags: |
            type=raw,value=3.9
            type=raw,value=3.9-ubuntu
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.pandoc-fonts
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max